services:
  - type: web
    name: fitness-tracker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm install && npm run build && rm -rf ../backend/static && mkdir -p ../backend/static && cp -r dist/. ../backend/static/ && test -n "$(ls -A ../backend/static/assets/*.js 2>/dev/null)" && echo "Static assets OK"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_VISION_MODEL
        value: llama-3.2-90b-vision-preview
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: YT_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false